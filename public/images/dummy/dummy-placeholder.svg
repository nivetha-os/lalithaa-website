<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E233D" />
      <stop offset="60%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B15" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#CFD6E4" />
      <stop offset="100%" stop-color="#9AA6BD" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgGrad)" />
  <circle cx="300" cy="270" r="170" fill="url(#glow)" />
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="8 6" />

  <!-- Lalitha Signature Geometric Diamond Emblem -->
  <g filter="url(#softGlow)" transform="translate(300, 260) scale(3.5)">
    <!-- 4 Diamond Facets -->
    <path d="M 0 -22 L 7 -7 L 0 0 L -7 -7 Z" stroke="url(#silver)" stroke-width="0.8" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M 0 22 L 7 7 L 0 0 L -7 7 Z" stroke="url(#silver)" stroke-width="0.8" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M -22 0 L -7 -7 L 0 0 L -7 7 Z" stroke="url(#silver)" stroke-width="0.8" fill="#FFFFFF" fill-opacity="0.9" />
    <path d="M 22 0 L 7 -7 L 0 0 L 7 7 Z" stroke="url(#silver)" stroke-width="0.8" fill="#FFFFFF" fill-opacity="0.9" />
    <circle cx="0" cy="0" r="2" fill="#071426" stroke="#FFFFFF" stroke-width="0.5" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M 300 150 L 302 158 L 310 160 L 302 162 L 300 170 L 298 162 L 290 160 L 298 158 Z" />
    <path d="M 300 370 L 302 378 L 310 380 L 302 382 L 300 390 L 298 382 L 290 380 L 298 378 Z" />
    <path d="M 190 260 L 191 266 L 197 267 L 191 268 L 190 274 L 189 268 L 183 267 L 189 266 Z" opacity="0.7" />
    <path d="M 410 260 L 411 266 L 417 267 L 411 268 L 410 274 L 409 268 L 403 267 L 409 266 Z" opacity="0.7" />
  </g>

  <text x="300" y="475" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#FFFFFF" letter-spacing="4" opacity="0.95">LALITHA</text>
  <text x="300" y="502" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" fill="#ADB6CB" letter-spacing="3" text-transform="uppercase">Haute Joaillerie &bull; Curated Masterpiece</text>
</svg>