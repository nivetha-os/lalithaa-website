<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E233D" />
      <stop offset="60%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B15" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E6EF" />
      <stop offset="70%" stop-color="#ADB6CB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="600" height="600" rx="24" fill="url(#bgGrad)" />
  <circle cx="300" cy="270" r="170" fill="url(#glow)" />
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="8 6" />

  <!-- Pair of Earrings -->
  <!-- Left Earring -->
  <g filter="url(#softGlow)" transform="translate(230, 160)">
    <!-- Top Stud -->
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <line x1="0" y1="8" x2="0" y2="24" stroke="url(#silver)" stroke-width="2.5" />
    <!-- Intermediate Link -->
    <circle cx="0" cy="28" r="5" fill="#FFFFFF" />
    <line x1="0" y1="33" x2="0" y2="52" stroke="url(#silver)" stroke-width="2.5" />
    <!-- Chandelier tier -->
    <path d="M -22 62 Q 0 54 22 62" stroke="url(#silver)" stroke-width="2.5" fill="none" />
    <circle cx="-22" cy="62" r="4.5" fill="#FFFFFF" />
    <circle cx="0" cy="56" r="6" fill="#FFFFFF" />
    <circle cx="22" cy="62" r="4.5" fill="#FFFFFF" />
    <!-- Lower Cascading Pear Drop -->
    <path d="M 0 70 C -16 95 -12 125 0 145 C 12 125 16 95 0 70 Z" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <circle cx="0" cy="115" r="4" fill="#071426" opacity="0.6" />
  </g>

  <!-- Right Earring -->
  <g filter="url(#softGlow)" transform="translate(370, 160)">
    <circle cx="0" cy="0" r="8" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <line x1="0" y1="8" x2="0" y2="24" stroke="url(#silver)" stroke-width="2.5" />
    <circle cx="0" cy="28" r="5" fill="#FFFFFF" />
    <line x1="0" y1="33" x2="0" y2="52" stroke="url(#silver)" stroke-width="2.5" />
    <path d="M -22 62 Q 0 54 22 62" stroke="url(#silver)" stroke-width="2.5" fill="none" />
    <circle cx="-22" cy="62" r="4.5" fill="#FFFFFF" />
    <circle cx="0" cy="56" r="6" fill="#FFFFFF" />
    <circle cx="22" cy="62" r="4.5" fill="#FFFFFF" />
    <path d="M 0 70 C -16 95 -12 125 0 145 C 12 125 16 95 0 70 Z" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <circle cx="0" cy="115" r="4" fill="#071426" opacity="0.6" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M 230 305 L 232 313 L 240 315 L 232 317 L 230 325 L 228 317 L 220 315 L 228 313 Z" />
    <path d="M 370 305 L 372 313 L 380 315 L 372 317 L 370 325 L 368 317 L 360 315 L 368 313 Z" />
    <path d="M 300 240 L 301 245 L 306 246 L 301 247 L 300 252 L 299 247 L 294 246 L 299 245 Z" opacity="0.6" />
  </g>

  <text x="300" y="475" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#FFFFFF" letter-spacing="4" opacity="0.95">LALITHA</text>
  <text x="300" y="502" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" fill="#ADB6CB" letter-spacing="3" text-transform="uppercase">Haute Joaillerie &bull; Diamond Earrings</text>
</svg>