<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0E233D" />
      <stop offset="60%" stop-color="#071426" />
      <stop offset="100%" stop-color="#040B15" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E6EF" />
      <stop offset="70%" stop-color="#ADB6CB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Circular Ambient Halo -->
  <circle cx="300" cy="280" r="180" fill="url(#glow)" />

  <!-- Geometric Luxury Border Outline -->
  <rect x="24" y="24" width="552" height="552" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.2" stroke-dasharray="8 6" />

  <!-- Stylized Diamond Necklace Arc -->
  <g filter="url(#softGlow)" transform="translate(0, -10)">
    <!-- Outer Arc -->
    <path d="M 160 210 Q 300 410 440 210" fill="none" stroke="url(#silver)" stroke-width="3" stroke-linecap="round" />
    <path d="M 180 230 Q 300 390 420 230" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.8" />

    <!-- Diamond Rivière Gemstones along the arc -->
    <circle cx="160" cy="210" r="4.5" fill="#FFFFFF" />
    <circle cx="185" cy="245" r="5" fill="#FFFFFF" />
    <circle cx="215" cy="280" r="5.5" fill="#FFFFFF" />
    <circle cx="250" cy="310" r="6.5" fill="#FFFFFF" />
    <circle cx="285" cy="326" r="7.5" fill="#FFFFFF" />
    
    <!-- Central Focal Drop -->
    <circle cx="300" cy="330" r="9" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <!-- Focal Pear Cut Pendant -->
    <path d="M 300 338 C 290 355 285 375 300 395 C 315 375 310 355 300 338 Z" fill="#FFFFFF" stroke="url(#silver)" stroke-width="2" />
    <circle cx="300" cy="375" r="3.5" fill="#071426" opacity="0.6" />

    <circle cx="315" cy="326" r="7.5" fill="#FFFFFF" />
    <circle cx="350" cy="310" r="6.5" fill="#FFFFFF" />
    <circle cx="385" cy="280" r="5.5" fill="#FFFFFF" />
    <circle cx="415" cy="245" r="5" fill="#FFFFFF" />
    <circle cx="440" cy="210" r="4.5" fill="#FFFFFF" />
  </g>

  <!-- Sparkles -->
  <g fill="#FFFFFF" opacity="0.9">
    <path d="M 300 395 L 302 405 L 312 407 L 302 409 L 300 419 L 298 409 L 288 407 L 298 405 Z" />
    <path d="M 230 250 L 231 256 L 237 257 L 231 258 L 230 264 L 229 258 L 223 257 L 229 256 Z" opacity="0.75" />
    <path d="M 370 250 L 371 256 L 377 257 L 371 258 L 370 264 L 369 258 L 363 257 L 369 256 Z" opacity="0.75" />
  </g>

  <!-- Labels -->
  <text x="300" y="475" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="14" fill="#FFFFFF" letter-spacing="4" opacity="0.95">LALITHA</text>
  <text x="300" y="502" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="11" fill="#ADB6CB" letter-spacing="3" text-transform="uppercase">Haute Joaillerie &bull; Diamond Necklace</text>
</svg>